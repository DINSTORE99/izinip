<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Panel - List IP Terdaftar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: { bg: '#0B0F19', card: '#111827', border: '#1F2937' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-cyber-bg text-slate-100 font-sans min-h-screen py-8 px-4 flex flex-col items-center">

    <!-- Modal Login PIN Owner -->
    <div id="pinModal" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-cyber-card border border-cyber-border p-6 rounded-2xl max-w-sm w-full space-y-4 text-center">
            <div class="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-base font-bold text-white">Masukkan PIN Owner</h2>
            <p class="text-xs text-slate-400">Halaman ini hanya untuk pemilik autoscript.</p>
            <input type="password" id="ownerPin" placeholder="PIN Rahasia" class="w-full bg-slate-900 border border-cyber-border rounded-lg px-3 py-2 text-center text-sm font-mono text-white focus:outline-none focus:border-emerald-500">
            <button onclick="checkPin()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-semibold">Buka Panel</button>
        </div>
    </div>

    <!-- Container Daftar IP -->
    <div id="mainContainer" class="max-w-4xl w-full space-y-6 hidden">
        <div class="flex items-center justify-between border-b border-cyber-border pb-4">
            <div>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-emerald-400"></i> Owner Portal - Daftar IP Izin
                </h1>
                <p class="text-xs text-slate-400">Repositori GitHub: <span class="text-emerald-400 font-mono">DIN-STORE/izin &bull; ip</span></p>
            </div>
            <div class="flex gap-2">
                <button onclick="loadIPs()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg border border-cyber-border">
                    <i class="fa-solid fa-rotate mr-1"></i> Refresh
                </button>
                <a href="/" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg border border-cyber-border text-slate-300">
                    Halaman Depan
                </a>
            </div>
        </div>

        <!-- Tabel Daftar IP -->
        <div class="bg-cyber-card border border-cyber-border rounded-xl overflow-hidden shadow-xl">
            <div class="p-3.5 border-b border-cyber-border flex justify-between items-center bg-slate-900/50">
                <span class="text-xs uppercase font-bold text-slate-400">Daftar Lisensi Aktif</span>
                <span id="ipCount" class="text-xs font-mono px-2 py-0.5 bg-slate-800 text-emerald-400 rounded">0 IP</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900 text-slate-400 text-xs uppercase border-b border-cyber-border">
                        <tr>
                            <th class="px-4 py-3">Nama Client</th>
                            <th class="px-4 py-3">Expired</th>
                            <th class="px-4 py-3">Alamat IP</th>
                            <th class="px-4 py-3 text-right">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="ipTableBody" class="divide-y divide-cyber-border/60">
                        <tr>
                            <td colspan="4" class="text-center py-6 text-slate-500">Memuat data dari GitHub...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Ubah PIN di bawah ini sesuai keinginan Anda
        const OWNER_PIN = "1234"; 
        let rawContentCache = "";

        function checkPin() {
            const input = document.getElementById("ownerPin").value;
            if (input === OWNER_PIN) {
                document.getElementById("pinModal").classList.add("hidden");
                document.getElementById("mainContainer").classList.remove("hidden");
                loadIPs();
            } else {
                alert("PIN Salah!");
            }
        }

        async function loadIPs() {
            const tbody = document.getElementById("ipTableBody");
            try {
                const res = await fetch("/api/ip");
                const data = await res.json();
                if (!data.success) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-rose-400">${data.message}</td></tr>`;
                    return;
                }
                rawContentCache = data.rawContent;
                renderTable(data.rawContent);
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-rose-400">Gagal mengambil data: ${err.message}</td></tr>`;
            }
        }

        function renderTable(content) {
            const tbody = document.getElementById("ipTableBody");
            const lines = content.split("\n").filter(l => l.trim().length > 0);
            document.getElementById("ipCount").innerText = `${lines.length} IP`;

            if (lines.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-500">Tidak ada IP terdaftar.</td></tr>`;
                return;
            }

            tbody.innerHTML = lines.map((line, idx) => {
                const cleaned = line.replace(/^###\s*/, "").trim();
                const parts = cleaned.split(/\s+/);
                const name = parts[0] || "-";
                const exp  = parts[1] || "-";
                const ip   = parts[2] || "-";

                return `
                    <tr class="hover:bg-slate-800/40">
                        <td class="px-4 py-3 font-semibold text-white">${name}</td>
                        <td class="px-4 py-3 font-mono text-xs text-slate-400">${exp}</td>
                        <td class="px-4 py-3 font-mono text-emerald-400 font-semibold">${ip}</td>
                        <td class="px-4 py-3 text-right">
                            <button onclick="deleteLine(${idx})" class="text-xs text-rose-400 hover:text-rose-300 px-2 py-1 bg-rose-500/10 rounded transition">
                                <i class="fa-solid fa-trash mr-1"></i> Cabut
                            </button>
                        </td>
                    </tr>
                `;
            }).join("");
        }

        async function deleteLine(index) {
            if (!confirm("Cabut izin IP ini?")) return;
            const lines = rawContentCache.split("\n").filter(l => l.trim().length > 0);
            lines.splice(index, 1);
            const updated = lines.length > 0 ? `${lines.join("\n")}\n` : "";

            try {
                const res = await fetch("/api/ip", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ newContent: updated, message: "Cabut izin IP" })
                });
                const data = await res.json();
                if (data.success) {
                    loadIPs();
                } else {
                    alert(`Gagal: ${data.message}`);
                }
            } catch(e) {
                alert(`Error: ${e.message}`);
            }
        }
    </script>
</body>
</html>
