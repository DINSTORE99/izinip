<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare Subdomain </title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: { 
                            bg: '#05070B', 
                            card: '#0A0F18', 
                            border: '#1E293B', 
                            accent: '#06B6D4' 
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #05070B; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 9999px; }

        body {
            background-color: #05070B;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 38px 38px;
            background-position: center top;
        }

        .ambient-radial {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 450px;
            background: radial-gradient(ellipse at top, rgba(6, 182, 212, 0.14), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .glass-panel {
            background: rgba(10, 15, 24, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
        }

        .glass-panel:hover {
            border-color: rgba(6, 182, 212, 0.25);
        }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen py-8 px-4 flex flex-col items-center selection:bg-cyan-500 selection:text-white relative overflow-x-hidden">

    <div class="ambient-radial"></div>

    <div class="max-w-2xl w-full space-y-6 relative z-10">

        <!-- Header -->
        <div class="glass-panel p-5 rounded-2xl flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-slate-900 border border-cyan-500/40 flex items-center justify-center text-cyan-400 text-xl font-bold shadow-[0_0_15px_rgba(6,182,212,0.25)]">
                    <i class="fa-solid fa-cloud"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                        Cloudflare Subdomain
                        <span class="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-cyan-500/10 border border-cyan-500/30 text-cyan-400">dinn.my.id</span>
                    </h1>
                    <p class="text-xs text-slate-400">Pointing DNS Subdomain & Ganti IP VPS</p>
                </div>
            </div>
            <a href="/" class="px-3.5 py-1.5 bg-slate-900 hover:bg-slate-800 text-xs rounded-lg border border-slate-800 text-slate-300 transition flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left"></i> Menu Utama
            </a>
        </div>

        <!-- Info Singkat DNS Server -->
        <div class="glass-panel px-4 py-3 rounded-xl border border-cyan-500/20 bg-cyan-950/10 flex items-center justify-between text-xs">
            <div class="flex items-center gap-2 text-slate-300">
                <i class="fa-solid fa-circle-nodes text-cyan-400"></i>
                <span>Tipe Record: <strong class="text-cyan-300 font-mono">A Record</strong></span>
            </div>
            <span class="text-[11px] font-mono text-emerald-400 bg-emerald-950/60 px-2.5 py-0.5 rounded border border-emerald-500/30 flex items-center gap-1">
                <i class="fa-solid fa-bolt text-[10px]"></i> DNS Only (Bypass CDN)
            </span>
        </div>

        <!-- Card Form dengan Navigasi Tab -->
        <div class="glass-panel p-6 rounded-2xl space-y-5">
            
            <!-- Tab Switcher -->
            <div class="flex border-b border-cyber-border gap-2 text-xs sm:text-sm font-medium text-slate-400 pb-2">
                <button onclick="switchTab('create')" id="tabBtnCreate" class="px-3 py-1.5 rounded-lg bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-circle-plus"></i> Buat Subdomain Baru
                </button>
                <button onclick="switchTab('update')" id="tabBtnUpdate" class="px-3 py-1.5 rounded-lg hover:text-white hover:bg-slate-800 flex items-center gap-1.5 transition text-slate-400">
                    <i class="fa-solid fa-arrows-rotate"></i> Ganti IP Pointing
                </button>
            </div>

            <!-- FORM 1: BUAT SUBDOMAIN BARU -->
            <form id="formCreate" onsubmit="handleCreateSubdomain(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Nama Subdomain</label>
                    <div class="flex items-center">
                        <input type="text" id="newSubName" required placeholder="budi01" oninput="updateCreatePreview()" class="w-full bg-slate-950/90 border border-cyber-border rounded-l-lg px-3 py-2.5 text-sm font-mono text-white focus:outline-none focus:border-cyan-400">
                        <span class="bg-slate-900 border border-l-0 border-cyber-border rounded-r-lg px-3.5 py-2.5 text-xs font-mono text-slate-400 select-none">.dinn.my.id</span>
                    </div>
                    <p id="createPreview" class="text-[11px] font-mono text-slate-500 mt-1.5">Hostname: <span class="text-cyan-400">budi01.dinn.my.id</span></p>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">IP Target VPS</label>
                    <input type="text" id="newSubIp" required placeholder="Contoh: 103.149.20.12" class="w-full bg-slate-950/90 border border-cyber-border rounded-lg px-3 py-2.5 text-sm font-mono text-white focus:outline-none focus:border-cyan-400">
                </div>

                <div class="pt-2 border-t border-cyber-border">
                    <button type="submit" id="btnCreateSub" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-xs font-bold transition flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(6,182,212,0.3)]">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Pointing Subdomain Baru
                    </button>
                </div>
            </form>

            <!-- FORM 2: GANTI IP SUBDOMAIN -->
            <form id="formUpdate" onsubmit="handleUpdateIp(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Subdomain Terdaftar</label>
                    <div class="flex items-center">
                        <input type="text" id="updateSubName" required placeholder="budi01" oninput="updateEditPreview()" class="w-full bg-slate-950/90 border border-cyber-border rounded-l-lg px-3 py-2.5 text-sm font-mono text-white focus:outline-none focus:border-amber-400">
                        <span class="bg-slate-900 border border-l-0 border-cyber-border rounded-r-lg px-3.5 py-2.5 text-xs font-mono text-slate-400 select-none">.dinn.my.id</span>
                    </div>
                    <p id="editPreview" class="text-[11px] font-mono text-slate-500 mt-1.5">Hostname: <span class="text-amber-400">budi01.dinn.my.id</span></p>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">IP VPS Baru</label>
                    <input type="text" id="updateNewIp" required placeholder="Contoh: 103.149.20.99" class="w-full bg-slate-950/90 border border-cyber-border rounded-lg px-3 py-2.5 text-sm font-mono text-white focus:outline-none focus:border-amber-400">
                </div>

                <div class="pt-2 border-t border-cyber-border">
                    <button type="submit" id="btnUpdateSub" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-bold transition flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(217,119,6,0.3)]">
                        <i class="fa-solid fa-arrows-rotate"></i> Update IP Pointing
                    </button>
                </div>
            </form>

        </div>

        <!-- Kartu Hasil Sukses Pointing -->
        <div id="resultCard" class="hidden glass-panel border border-cyan-500/50 bg-cyan-950/20 p-5 rounded-2xl space-y-2">
            <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-check"></i> Pointing DNS Berhasil Disimpan!
                </span>
            </div>
            <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono space-y-1">
                <div class="text-slate-400">Host: <span id="resHost" class="text-white font-bold"></span></div>
                <div class="text-slate-400">Target IP: <span id="resIp" class="text-emerald-400 font-bold"></span></div>
            </div>
        </div>

    </div>

    <script>
        function switchTab(tab) {
            const btnCreate = document.getElementById("tabBtnCreate");
            const btnUpdate = document.getElementById("tabBtnUpdate");
            const formCreate = document.getElementById("formCreate");
            const formUpdate = document.getElementById("formUpdate");

            if (tab === 'create') {
                btnCreate.className = "px-3 py-1.5 rounded-lg bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 flex items-center gap-1.5 transition";
                btnUpdate.className = "px-3 py-1.5 rounded-lg hover:text-white hover:bg-slate-800 flex items-center gap-1.5 transition text-slate-400";
                formCreate.classList.remove("hidden");
                formUpdate.classList.add("hidden");
            } else {
                btnUpdate.className = "px-3 py-1.5 rounded-lg bg-amber-500/10 text-amber-400 border border-amber-500/30 flex items-center gap-1.5 transition";
                btnCreate.className = "px-3 py-1.5 rounded-lg hover:text-white hover:bg-slate-800 flex items-center gap-1.5 transition text-slate-400";
                formUpdate.classList.remove("hidden");
                formCreate.classList.add("hidden");
            }
            document.getElementById("resultCard").classList.add("hidden");
        }

        function updateCreatePreview() {
            const val = document.getElementById("newSubName").value.trim() || "budi01";
            document.getElementById("createPreview").innerHTML = `Hostname: <span class="text-cyan-400">${val}.dinn.my.id</span>`;
        }

        function updateEditPreview() {
            const val = document.getElementById("updateSubName").value.trim() || "budi01";
            document.getElementById("editPreview").innerHTML = `Hostname: <span class="text-amber-400">${val}.dinn.my.id</span>`;
        }

        async function handleCreateSubdomain(e) {
            e.preventDefault();
            const sub = document.getElementById("newSubName").value.trim();
            const ip  = document.getElementById("newSubIp").value.trim();

            const btn = document.getElementById("btnCreateSub");
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan ke Cloudflare...`;

            try {
                const res = await fetch("/api/cf", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ subName: sub, targetIp: ip })
                });
                const data = await res.json();

                if (data.success) {
                    showResult(`${sub}.dinn.my.id`, ip);
                    document.getElementById("newSubName").value = "";
                    document.getElementById("newSubIp").value = "";
                    updateCreatePreview();
                } else {
                    alert(`Gagal: ${data.message}`);
                }
            } catch (err) {
                alert(`Error: ${err.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Pointing Subdomain Baru`;
            }
        }

        async function handleUpdateIp(e) {
            e.preventDefault();
            const sub   = document.getElementById("updateSubName").value.trim();
            const newIp = document.getElementById("updateNewIp").value.trim();

            const btn = document.getElementById("btnUpdateSub");
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memperbarui IP...`;

            try {
                const res = await fetch("/api/cf", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ subName: sub, newIp: newIp })
                });
                const data = await res.json();

                if (data.success) {
                    showResult(`${sub}.dinn.my.id`, newIp);
                    document.getElementById("updateSubName").value = "";
                    document.getElementById("updateNewIp").value = "";
                    updateEditPreview();
                } else {
                    alert(`Gagal: ${data.message}`);
                }
            } catch (err) {
                alert(`Error: ${err.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-arrows-rotate"></i> Update IP Pointing`;
            }
        }

        function showResult(host, ip) {
            document.getElementById("resHost").innerText = host;
            document.getElementById("resIp").innerText = ip;
            document.getElementById("resultCard").classList.remove("hidden");
            document.getElementById("resultCard").scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
