<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare Subdomain Portal - DIN-STORE</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: { 
                            bg: '#05070B', 
                            card: '#0A0F18', 
                            border: '#1E293B', 
                            accent: '#06B6D4' 
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #05070B; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 9999px; }

        /* Background Grid Kotak-Kotak Persis Tema Cyber */
        body {
            background-color: #05070B;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 38px 38px;
            background-position: center top;
        }

        /* Ambient Glow di Bagian Atas */
        .ambient-radial {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 450px;
            background: radial-gradient(ellipse at top, rgba(6, 182, 212, 0.12), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Glass Panel Elegan */
        .glass-panel {
            background: rgba(10, 15, 24, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
        }

        .glass-panel:hover {
            border-color: rgba(6, 182, 212, 0.25);
        }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen py-8 px-4 flex flex-col items-center selection:bg-cyan-500 selection:text-white relative overflow-x-hidden">

    <!-- Efek Cahaya Cyan Lembut di Atas -->
    <div class="ambient-radial"></div>

    <div class="max-w-3xl w-full space-y-6 relative z-10">

        <!-- Header -->
        <div class="glass-panel p-5 rounded-2xl flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-slate-900 border border-cyan-500/40 flex items-center justify-center text-cyan-400 text-xl font-bold shadow-[0_0_15px_rgba(6,182,212,0.25)]">
                    <i class="fa-solid fa-cloud"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                        Cloudflare Subdomain Portal
                        <span class="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-cyan-500/10 border border-cyan-500/30 text-cyan-400">dinn.my.id</span>
                    </h1>
                    <p class="text-xs text-slate-400">Pointing DNS Subdomain Baru & Penggantian Alamat IP VPS</p>
                </div>
            </div>
            <a href="/" class="px-3.5 py-1.5 bg-slate-900 hover:bg-slate-800 text-xs rounded-lg border border-slate-800 text-slate-300 transition flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left"></i> Menu Utama
            </a>
        </div>

        <!-- 2 Formulir: Buat Baru & Ganti IP (Tanpa Tabel Daftar) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

            <!-- Form 1: Registrasi Subdomain Baru -->
            <div class="glass-panel p-5 rounded-2xl space-y-4">
                <h2 class="text-sm font-bold text-cyan-400 flex items-center gap-2">
                    <i class="fa-solid fa-circle-plus"></i> Buat Subdomain Baru
                </h2>
                <form onsubmit="handleCreateSubdomain(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Nama Subdomain</label>
                        <div class="flex items-center">
                            <input type="text" id="newSubName" required placeholder="budi01" class="w-full bg-slate-950/90 border border-cyber-border rounded-l-lg px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-cyan-400">
                            <span class="bg-slate-900 border border-l-0 border-cyber-border rounded-r-lg px-3 py-2 text-xs font-mono text-slate-400">.dinn.my.id</span>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-xs text-slate-400">IP Target VPS</label>
                            <button type="button" onclick="detectIP('newSubIp')" class="text-[10px] text-cyan-400 hover:underline">Gunakan IP Saya</button>
                        </div>
                        <input type="text" id="newSubIp" required placeholder="Contoh: 103.149.20.12" class="w-full bg-slate-950/90 border border-cyber-border rounded-lg px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-cyan-400">
                    </div>
                    <button type="submit" id="btnCreateSub" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-xs font-bold transition flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(6,182,212,0.3)]">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Pointing Subdomain
                    </button>
                </form>
            </div>

            <!-- Form 2: Ganti IP Subdomain yang Sudah Ada -->
            <div class="glass-panel p-5 rounded-2xl space-y-4">
                <h2 class="text-sm font-bold text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square"></i> Ganti IP Subdomain yang Ada
                </h2>
                <form onsubmit="handleUpdateIp(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Subdomain Terdaftar</label>
                        <div class="flex items-center">
                            <input type="text" id="updateSubName" required placeholder="budi01" class="w-full bg-slate-950/90 border border-cyber-border rounded-l-lg px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-amber-400">
                            <span class="bg-slate-900 border border-l-0 border-cyber-border rounded-r-lg px-3 py-2 text-xs font-mono text-slate-400">.dinn.my.id</span>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-xs text-slate-400">IP VPS Baru</label>
                            <button type="button" onclick="detectIP('updateNewIp')" class="text-[10px] text-amber-400 hover:underline">Gunakan IP Saya</button>
                        </div>
                        <input type="text" id="updateNewIp" required placeholder="Contoh: 103.149.20.99" class="w-full bg-slate-950/90 border border-cyber-border rounded-lg px-3 py-2 text-sm font-mono text-white focus:outline-none focus:border-amber-400">
                    </div>
                    <button type="submit" id="btnUpdateSub" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-bold transition flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(217,119,6,0.3)]">
                        <i class="fa-solid fa-arrows-rotate"></i> Update IP Pointing
                    </button>
                </form>
            </div>

        </div>

    </div>

    <script>
        async function detectIP(targetInputId) {
            try {
                const res = await fetch("https://api.ipify.org?format=json");
                const data = await res.json();
                document.getElementById(targetInputId).value = data.ip;
            } catch (e) {
                alert("Gagal mendeteksi IP!");
            }
        }

        async function handleCreateSubdomain(e) {
            e.preventDefault();
            const sub = document.getElementById("newSubName").value.trim();
            const ip  = document.getElementById("newSubIp").value.trim();

            const btn = document.getElementById("btnCreateSub");
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memproses ke Cloudflare...`;

            try {
                const res = await fetch("/api/cf", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ subName: sub, targetIp: ip })
                });
                const data = await res.json();

                if (data.success) {
                    alert(data.message);
                    document.getElementById("newSubName").value = "";
                    document.getElementById("newSubIp").value = "";
                } else {
                    alert(`Gagal: ${data.message}`);
                }
            } catch (err) {
                alert(`Error: ${err.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Pointing Subdomain`;
            }
        }

        async function handleUpdateIp(e) {
            e.preventDefault();
            const sub   = document.getElementById("updateSubName").value.trim();
            const newIp = document.getElementById("updateNewIp").value.trim();

            const btn = document.getElementById("btnUpdateSub");
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Mengubah IP...`;

            try {
                const res = await fetch("/api/cf", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ subName: sub, newIp: newIp })
                });
                const data = await res.json();

                if (data.success) {
                    alert(data.message);
                    document.getElementById("updateSubName").value = "";
                    document.getElementById("updateNewIp").value = "";
                } else {
                    alert(`Gagal: ${data.message}`);
                }
            } catch (err) {
                alert(`Error: ${err.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-arrows-rotate"></i> Update IP Pointing`;
            }
        }
    </script>
</body>
</html>
